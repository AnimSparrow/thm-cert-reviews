<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" width="780" height="240" role="img" aria-label="SEC0 SPARROW scorecard, overall 4.88 out of 10">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0633"/><stop offset="100%" stop-color="#3a0a5e"/>
    </linearGradient>
    <linearGradient id="scoreGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#00B8D4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text{font-family:ui-monospace,'SF Mono',Menlo,'Cascadia Code',Consolas,monospace}
    .lbl{fill:#F8E8FF;font-size:12px;font-weight:600}
    .dim{fill:#A479C4;font-size:9.5px;font-weight:600;letter-spacing:0.5px}
    .val{fill:#F8E8FF;font-size:12px;font-weight:700}
    .tier{fill:#A479C4;font-size:10.5px;font-weight:700;letter-spacing:1px}
  </style>

  <rect x="0.5" y="0.5" width="779" height="239" rx="16" fill="url(#bg)" stroke="#FF2A6D" stroke-opacity="0.30"/>

  <!-- left: big score -->
  <g transform="translate(28,0)">
    <rect x="0" y="26" width="150" height="20" rx="5" fill="#FF2A6D" fill-opacity="0.12" stroke="#FF2A6D" stroke-opacity="0.5"/>
    <text x="75" y="40" fill="#FF2A6D" font-size="10.5" font-weight="700" letter-spacing="2" text-anchor="middle">OVERALL SCORE</text>

    <text x="0" y="128" fill="url(#scoreGrad)" font-size="60" font-weight="700" filter="url(#glow)">4.88</text>
    <text x="140" y="118" fill="#A479C4" font-size="18" font-weight="700">/10</text>

    <text x="0" y="160" class="tier">WEIGHTED</text>
    <text x="0" y="182" class="tier">HIGH &#215;6</text>
    <text x="0" y="202" class="tier">MEDIUM &#215;2</text>
    <text x="0" y="222" class="tier">LOW &#215;1</text>
  </g>

  <rect x="216" y="26" width="1" height="204" fill="#FF2A6D" opacity="0.25"/>

  <!-- right: bar chart, one row per letter -->
  <g transform="translate(250,20)">
    <!-- S -->
    <g transform="translate(0,0)">
      <text x="0" y="12" class="lbl">S</text>
      <text x="18" y="12" class="dim">SCOPE</text>
      <rect x="140" y="4" width="260" height="7" rx="3.5" fill="#2a0e4a"/>
      <rect x="140" y="4" width="234" height="7" rx="3.5" fill="#A479C4"/>
      <text x="416" y="10" class="val">9</text>
    </g>
    <!-- P -->
    <g transform="translate(0,27)">
      <text x="0" y="12" class="lbl">P</text>
      <text x="18" y="12" class="dim">PRACTICALITY</text>
      <rect x="140" y="4" width="260" height="7" rx="3.5" fill="#2a0e4a"/>
      <rect x="140" y="4" width="130" height="7" rx="3.5" fill="#FF2A6D"/>
      <text x="416" y="10" class="val">5</text>
    </g>
    <!-- A -->
    <g transform="translate(0,54)">
      <text x="0" y="12" class="lbl">A</text>
      <text x="18" y="12" class="dim">ACCESS</text>
      <rect x="140" y="4" width="260" height="7" rx="3.5" fill="#2a0e4a"/>
      <rect x="140" y="4" width="260" height="7" rx="3.5" fill="#00F0FF"/>
      <text x="416" y="10" class="val">10</text>
    </g>
    <!-- R reliability -->
    <g transform="translate(0,81)">
      <text x="0" y="12" class="lbl">R</text>
      <text x="18" y="12" class="dim">RELIABILITY</text>
      <rect x="140" y="4" width="260" height="7" rx="3.5" fill="#2a0e4a"/>
      <rect x="140" y="4" width="234" height="7" rx="3.5" fill="#00F0FF"/>
      <text x="416" y="10" class="val">9</text>
    </g>
    <!-- R rigor -->
    <g transform="translate(0,108)">
      <text x="0" y="12" class="lbl">R</text>
      <text x="18" y="12" class="dim">RIGOR</text>
      <rect x="140" y="4" width="260" height="7" rx="3.5" fill="#2a0e4a"/>
      <rect x="140" y="4" width="182" height="7" rx="3.5" fill="#A479C4"/>
      <text x="416" y="10" class="val">7</text>
    </g>
    <!-- O -->
    <g transform="translate(0,135)">
      <text x="0" y="12" class="lbl">O</text>
      <text x="18" y="12" class="dim">OUTCOME</text>
      <rect x="140" y="4" width="260" height="7" rx="3.5" fill="#2a0e4a"/>
      <rect x="140" y="4" width="26" height="7" rx="3.5" fill="#FF2A6D"/>
      <text x="416" y="10" class="val">1</text>
    </g>
    <!-- W -->
    <g transform="translate(0,162)">
      <text x="0" y="12" class="lbl">W</text>
      <text x="18" y="12" class="dim">WORTH</text>
      <rect x="140" y="4" width="260" height="7" rx="3.5" fill="#2a0e4a"/>
      <rect x="140" y="4" width="130" height="7" rx="3.5" fill="#FF2A6D"/>
      <text x="416" y="10" class="val">5</text>
    </g>
  </g>

  <!-- legend -->
  <g transform="translate(250,224)">
    <rect x="0" y="-6" width="8" height="8" rx="2" fill="#FF2A6D"/>
    <text x="12" y="1" class="dim">HIGH WEIGHT</text>
    <rect x="112" y="-6" width="8" height="8" rx="2" fill="#A479C4"/>
    <text x="124" y="1" class="dim">MEDIUM WEIGHT</text>
    <rect x="252" y="-6" width="8" height="8" rx="2" fill="#00F0FF"/>
    <text x="264" y="1" class="dim">LOW WEIGHT</text>
  </g>
</svg>
