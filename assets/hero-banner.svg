<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-label="TryHackMe Certification Reviews - After Action Reports scored on S.P.A.R.R.O.W.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0633"/><stop offset="100%" stop-color="#3a0a5e"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF"/><stop offset="55%" stop-color="#A479C4"/><stop offset="100%" stop-color="#FF2A6D"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2A6D" stop-opacity="0"/><stop offset="50%" stop-color="#FF2A6D" stop-opacity="0.6"/><stop offset="100%" stop-color="#FF2A6D" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>text{font-family:ui-monospace,'SF Mono',Menlo,'Cascadia Code',Consolas,monospace}</style>

  <rect x="0.5" y="0.5" width="899" height="189" rx="14" fill="url(#bg)" stroke="#FF2A6D" stroke-opacity="0.30"/>
  <path d="M 16,1 L 90,1 L 16,75 Z" fill="#FF2A6D" opacity="0.10"/>
  <path d="M 884,189 L 810,189 L 884,115 Z" fill="#00F0FF" opacity="0.08"/>

  <!-- eyebrow -->
  <g transform="translate(40,30)">
    <rect x="0" y="0" width="128" height="20" rx="5" fill="#FF2A6D" fill-opacity="0.12" stroke="#FF2A6D" stroke-opacity="0.5"/>
    <text x="64" y="14" fill="#FF2A6D" font-size="10.5" font-weight="700" letter-spacing="2.5" text-anchor="middle">TRYHACKME</text>
  </g>

  <!-- title -->
  <text x="40" y="104" fill="url(#hero)" font-size="40" font-weight="700" filter="url(#glow)">CERT REVIEWS</text>

  <!-- subtitle -->
  <text x="42" y="134" fill="#A479C4" font-size="13" font-weight="600" letter-spacing="1.2">AFTER ACTION REPORTS · SCORED ON S.P.A.R.R.O.W. · NO MARKETING COPY</text>

  <rect x="40" y="150" width="820" height="1" fill="url(#rule)"/>

  <!-- stat chips -->
  <g transform="translate(40,164)" font-size="10" font-weight="700" letter-spacing="1">
    <rect x="0" y="-2" width="132" height="20" rx="5" fill="#00F0FF" fill-opacity="0.10" stroke="#00F0FF" stroke-opacity="0.45"/>
    <text x="66" y="12" fill="#00F0FF" text-anchor="middle">8 / 8 CERTIFICATIONS</text>

    <rect x="144" y="-2" width="150" height="20" rx="5" fill="#FFB020" fill-opacity="0.12" stroke="#FFB020" stroke-opacity="0.5"/>
    <text x="219" y="12" fill="#FFD37A" text-anchor="middle">FIRST &amp; ONLY FULL SET</text>

    <rect x="306" y="-2" width="104" height="20" rx="5" fill="#A479C4" fill-opacity="0.14" stroke="#A479C4" stroke-opacity="0.5"/>
    <text x="358" y="12" fill="#C9ABE8" text-anchor="middle">AVG 7.35 / 10</text>
  </g>
</svg>
