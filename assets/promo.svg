<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 120" width="820" height="120" role="img" aria-label="20 percent off with code KAROL20, works on single certs and bundles">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2A6D"/><stop offset="55%" stop-color="#7a1152"/><stop offset="100%" stop-color="#1a0633"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#00B8D4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>text{font-family:ui-monospace,'SF Mono',Menlo,'Cascadia Code',Consolas,monospace}</style>

  <rect x="1.5" y="1.5" width="817" height="117" rx="18" fill="url(#bg)" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.6"/>
  <rect x="1.5" y="1.5" width="817" height="117" rx="18" fill="none" stroke="#FF2A6D" stroke-opacity="0.4" stroke-width="6"/>

  <!-- diagonal accent stripes -->
  <path d="M 0,120 L 40,120 L 90,0 L 50,0 Z" fill="#00F0FF" opacity="0.08"/>
  <path d="M 780,0 L 820,0 L 820,40 Z" fill="#00F0FF" opacity="0.10"/>

  <!-- percent badge -->
  <g transform="translate(34,26)">
    <circle cx="34" cy="34" r="34" fill="#1a0633" stroke="#00F0FF" stroke-width="2.5"/>
    <text x="34" y="30" fill="#00F0FF" font-size="20" font-weight="700" text-anchor="middle" filter="url(#softGlow)">20%</text>
    <text x="34" y="47" fill="#F8E8FF" font-size="9" font-weight="700" letter-spacing="1" text-anchor="middle">OFF</text>
  </g>

  <!-- main text -->
  <g transform="translate(118,0)">
    <text x="0" y="46" fill="#F8E8FF" font-size="15" font-weight="700" letter-spacing="1.5">DISCOUNT ON EVERY TRYHACKME CERTIFICATION</text>
    <text x="0" y="86" fill="url(#codeGrad)" font-size="34" font-weight="700" filter="url(#glow)">CODE: KAROL20</text>
  </g>

  <!-- right side note -->
  <g transform="translate(552,0)">
    <rect x="0" y="30" width="230" height="60" rx="10" fill="#1a0633" fill-opacity="0.55" stroke="#00F0FF" stroke-opacity="0.35"/>
    <text x="115" y="52" fill="#F8E8FF" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">WORKS ON</text>
    <text x="115" y="68" fill="#F8E8FF" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">SINGLE CERTS &amp; BUNDLES</text>
    <text x="115" y="83" fill="#00F0FF" font-size="10.5" font-weight="700" text-anchor="middle">tryhackme.com &#8594;</text>
  </g>
</svg>
