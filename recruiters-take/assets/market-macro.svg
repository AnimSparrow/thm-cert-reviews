<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="Market macro: the skills gap now outpaces the headcount gap">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a0633"/><stop offset="100%" stop-color="#3a0a5e"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#00B8D4"/></linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FF2A6D" stop-opacity="0"/><stop offset="50%" stop-color="#FF2A6D" stop-opacity="0.6"/><stop offset="100%" stop-color="#FF2A6D" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>text{font-family:ui-monospace,'SF Mono',Menlo,'Cascadia Code',Consolas,monospace}</style>
  <rect x="0.5" y="0.5" width="779" height="249" rx="16" fill="url(#bg)" stroke="#FF2A6D" stroke-opacity="0.30"/>
  <path d="M 16,1 L 76,1 L 16,61 Z" fill="#FF2A6D" opacity="0.10"/>

  <text x="28" y="40" fill="url(#hero)" font-size="18" font-weight="700" filter="url(#glow)">THE MARKET REWARDS PROOF, NOT PAPER</text>
  <text x="28" y="59" fill="#A479C4" font-size="10.5" font-weight="600">2025 ISC2 Workforce Study &#183; the skills gap has overtaken the headcount gap</text>
  <rect x="28" y="70" width="724" height="1" fill="url(#rule)"/>

  <!-- three stat tiles -->
  <g transform="translate(28,88)">
    <rect x="0" y="0" width="230" height="104" rx="10" fill="#FF2A6D" fill-opacity="0.08" stroke="#FF2A6D" stroke-opacity="0.5"/>
    <text x="16" y="52" fill="url(#hero)" font-size="40" font-weight="700" filter="url(#glow)">95%</text>
    <text x="16" y="74" fill="#F8E8FF" font-size="10" font-weight="600">of teams report at least</text>
    <text x="16" y="88" fill="#F8E8FF" font-size="10" font-weight="600">one skills gap</text>
  </g>
  <g transform="translate(275,88)">
    <rect x="0" y="0" width="230" height="104" rx="10" fill="#A479C4" fill-opacity="0.12" stroke="#A479C4" stroke-opacity="0.5"/>
    <text x="16" y="52" fill="#C9A8E4" font-size="40" font-weight="700">59%</text>
    <text x="16" y="74" fill="#F8E8FF" font-size="10" font-weight="600">call those gaps critical or</text>
    <text x="16" y="88" fill="#F8E8FF" font-size="10" font-weight="600">significant &#8212; up from 44%</text>
  </g>
  <g transform="translate(522,88)">
    <rect x="0" y="0" width="230" height="104" rx="10" fill="#FFB020" fill-opacity="0.12" stroke="#FFB020" stroke-opacity="0.5"/>
    <text x="16" y="52" fill="#FFD37A" font-size="40" font-weight="700">~4M</text>
    <text x="16" y="74" fill="#F8E8FF" font-size="10" font-weight="600">workforce gap, with Europe</text>
    <text x="16" y="88" fill="#F8E8FF" font-size="10" font-weight="600">under NIS2 / GDPR pressure</text>
  </g>

  <text x="28" y="222" fill="#F8E8FF" font-size="11" font-weight="600">Takeaway: the market pays for demonstrable skill &#8212; the tailwind under every hands-on cert.</text>
</svg>
