<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 334" width="780" height="334" role="img" aria-label="What European job ads actually name: SOC roles name SC-200, CISSP, GIAC, CEH; offensive roles name OSCP, CEH, eJPT, eCPPT, GPEN, CREST, OSWE; TryHackMe appears on the candidate side, not in requirements">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a0633"/><stop offset="100%" stop-color="#3a0a5e"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#00B8D4"/></linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FF2A6D" stop-opacity="0"/><stop offset="50%" stop-color="#FF2A6D" stop-opacity="0.6"/><stop offset="100%" stop-color="#FF2A6D" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>text{font-family:ui-monospace,'SF Mono',Menlo,'Cascadia Code',Consolas,monospace}</style>
  <rect x="0.5" y="0.5" width="779" height="333" rx="16" fill="url(#bg)" stroke="#FF2A6D" stroke-opacity="0.30"/>
  <path d="M 16,1 L 76,1 L 16,61 Z" fill="#FF2A6D" opacity="0.10"/>

  <text x="24" y="38" fill="url(#hero)" font-size="17" font-weight="700" filter="url(#glow)">WHAT EUROPEAN JOB ADS ACTUALLY NAME</text>
  <text x="24" y="56" fill="#A479C4" font-size="9.5" font-weight="600">named certs from live UK &amp; EU postings, 2026 &#8212; TryHackMe certs are absent here</text>
  <rect x="24" y="66" width="732" height="1" fill="url(#rule)"/>

  <g transform="translate(24,82)">
    <rect x="0" y="0" width="362" height="152" rx="10" fill="#00F0FF" fill-opacity="0.06" stroke="#00F0FF" stroke-opacity="0.5"/>
    <text x="16" y="26" fill="#00F0FF" font-size="12" font-weight="700">SOC / BLUE ROLES</text>
    <g font-size="9.5" font-weight="700" fill="#F8E8FF">
      <rect x="16" y="40" width="78" height="20" rx="5" fill="#00F0FF" fill-opacity="0.14"/><text x="55" y="54" text-anchor="middle">SC-200</text>
      <rect x="102" y="40" width="66" height="20" rx="5" fill="#00F0FF" fill-opacity="0.14"/><text x="135" y="54" text-anchor="middle">CISSP</text>
      <rect x="176" y="40" width="60" height="20" rx="5" fill="#00F0FF" fill-opacity="0.14"/><text x="206" y="54" text-anchor="middle">GIAC</text>
      <rect x="244" y="40" width="56" height="20" rx="5" fill="#00F0FF" fill-opacity="0.14"/><text x="272" y="54" text-anchor="middle">CEH</text>
      <rect x="16" y="68" width="140" height="20" rx="5" fill="#00F0FF" fill-opacity="0.14"/><text x="86" y="82" text-anchor="middle">Cisco CyberOps</text>
    </g>
    <text x="16" y="114" fill="#7FE9F5" font-size="8.5">SC-200 is a named requirement on live UK</text>
    <text x="16" y="128" fill="#7FE9F5" font-size="8.5">SOC ads; CISSP / GIAC / CEH on senior roles.</text>
  </g>

  <g transform="translate(394,82)">
    <rect x="0" y="0" width="362" height="152" rx="10" fill="#FF2A6D" fill-opacity="0.07" stroke="#FF2A6D" stroke-opacity="0.5"/>
    <text x="16" y="26" fill="#FF2A6D" font-size="12" font-weight="700">OFFENSIVE ROLES</text>
    <g font-size="9.5" font-weight="700" fill="#F8E8FF">
      <rect x="16" y="40" width="66" height="20" rx="5" fill="#FF2A6D" fill-opacity="0.16"/><text x="49" y="54" text-anchor="middle">OSCP</text>
      <rect x="90" y="40" width="58" height="20" rx="5" fill="#FF2A6D" fill-opacity="0.16"/><text x="119" y="54" text-anchor="middle">CEH</text>
      <rect x="156" y="40" width="60" height="20" rx="5" fill="#FF2A6D" fill-opacity="0.16"/><text x="186" y="54" text-anchor="middle">eJPT</text>
      <rect x="224" y="40" width="72" height="20" rx="5" fill="#FF2A6D" fill-opacity="0.16"/><text x="260" y="54" text-anchor="middle">eCPPT</text>
      <rect x="16" y="68" width="64" height="20" rx="5" fill="#FF2A6D" fill-opacity="0.16"/><text x="48" y="82" text-anchor="middle">GPEN</text>
      <rect x="88" y="68" width="74" height="20" rx="5" fill="#FF2A6D" fill-opacity="0.16"/><text x="125" y="82" text-anchor="middle">CREST</text>
      <rect x="170" y="68" width="66" height="20" rx="5" fill="#FF2A6D" fill-opacity="0.16"/><text x="203" y="82" text-anchor="middle">OSWE</text>
    </g>
    <text x="16" y="114" fill="#FF7AA5" font-size="8.5">Even the junior rival eJPT is named on EU</text>
    <text x="16" y="128" fill="#FF7AA5" font-size="8.5">consultancy ads; PT1 / WEB1 are not, yet.</text>
  </g>

  <g transform="translate(24,250)">
    <rect x="0" y="0" width="732" height="66" rx="10" fill="#FFB020" fill-opacity="0.10" stroke="#FFB020" stroke-opacity="0.5"/>
    <text x="16" y="24" fill="#FFD37A" font-size="11" font-weight="700">TRYHACKME (SAL1 / SAL2 / PT1 / WEB1 / AI1)</text>
    <text x="16" y="43" fill="#F8E8FF" font-size="9">Shows up on the candidate's side of the page: "TryHackMe labs", 200+ rooms, a linked</text>
    <text x="16" y="57" fill="#F8E8FF" font-size="9">profile &#8212; as proof of skill, not in the requirements line.</text>
  </g>
</svg>
