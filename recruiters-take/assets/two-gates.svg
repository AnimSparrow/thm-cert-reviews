<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-label="Two gates of hiring: recognisable certs get the invite, hands-on proof wins the offer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a0633"/><stop offset="100%" stop-color="#3a0a5e"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#00B8D4"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrowpink" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#FF2A6D"/></marker>
    <marker id="arrowcyan" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#00F0FF"/></marker>
    <marker id="arrowgold" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#FFB020"/></marker>
  </defs>
  <style>text{font-family:ui-monospace,'SF Mono',Menlo,'Cascadia Code',Consolas,monospace}</style>
  <rect x="0.5" y="0.5" width="779" height="329" rx="16" fill="url(#bg)" stroke="#FF2A6D" stroke-opacity="0.30"/>
  <path d="M 16,1 L 76,1 L 16,61 Z" fill="#FF2A6D" opacity="0.10"/>

  <text x="28" y="40" fill="url(#hero)" font-size="18" font-weight="700" filter="url(#glow)">TWO GATES BETWEEN YOU AND THE JOB</text>
  <text x="28" y="60" fill="#A479C4" font-size="10.5" font-weight="600" letter-spacing="0.5">recognisable certs get you IN THE ROOM &#183; hands-on proof gets you THE OFFER</text>

  <!-- APPLICANTS -->
  <g transform="translate(28,96)">
    <rect x="0" y="0" width="120" height="150" rx="10" fill="#2a0e4a" stroke="#5C2A8A" stroke-opacity="0.6"/>
    <text x="60" y="26" fill="#F8E8FF" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">APPLICANTS</text>
    <text x="60" y="44" fill="#6E5397" font-size="9" text-anchor="middle">the pile</text>
    <g fill="#7E63B0"><circle cx="30" cy="72" r="7"/><circle cx="60" cy="72" r="7"/><circle cx="90" cy="72" r="7"/><circle cx="30" cy="96" r="7"/><circle cx="60" cy="96" r="7"/><circle cx="90" cy="96" r="7"/><circle cx="45" cy="120" r="7"/><circle cx="75" cy="120" r="7"/></g>
  </g>
  <line x1="150" y1="171" x2="196" y2="171" stroke="#FF2A6D" stroke-width="2" marker-end="url(#arrowpink)"/>

  <!-- GATE 1 -->
  <g transform="translate(202,84)">
    <text x="112" y="-2" fill="#FF2A6D" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">&#9654; THE INVITE</text>
    <rect x="0" y="8" width="224" height="164" rx="10" fill="#FF2A6D" fill-opacity="0.08" stroke="#FF2A6D" stroke-opacity="0.55"/>
    <text x="16" y="32" fill="#FF2A6D" font-size="11" font-weight="700">GATE 1 &#183; SCREENING</text>
    <text x="16" y="49" fill="#A479C4" font-size="9">ATS keyword scan + HR filter</text>
    <text x="16" y="76" fill="#F8E8FF" font-size="9.5" font-weight="600">Passes on NAME RECOGNITION:</text>
    <g font-size="9.5" font-weight="700" fill="#F8E8FF">
      <rect x="16" y="86" width="86" height="18" rx="4" fill="#FF2A6D" fill-opacity="0.16"/><text x="59" y="99" text-anchor="middle">Security+</text>
      <rect x="108" y="86" width="66" height="18" rx="4" fill="#FF2A6D" fill-opacity="0.16"/><text x="141" y="99" text-anchor="middle">CySA+</text>
      <rect x="16" y="108" width="60" height="18" rx="4" fill="#FF2A6D" fill-opacity="0.16"/><text x="46" y="121" text-anchor="middle">BTL1</text>
      <rect x="82" y="108" width="64" height="18" rx="4" fill="#FF2A6D" fill-opacity="0.16"/><text x="114" y="121" text-anchor="middle">OSCP</text>
    </g>
    <text x="16" y="150" fill="#FF7AA5" font-size="9">THM certs: not named here yet</text>
  </g>
  <line x1="426" y1="171" x2="476" y2="171" stroke="#00F0FF" stroke-width="2" marker-end="url(#arrowcyan)"/>

  <!-- GATE 2 -->
  <g transform="translate(482,84)">
    <text x="112" y="-2" fill="#00F0FF" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">&#9654; THE WIN</text>
    <rect x="0" y="8" width="224" height="164" rx="10" fill="#00F0FF" fill-opacity="0.07" stroke="#00F0FF" stroke-opacity="0.55"/>
    <text x="16" y="32" fill="#00F0FF" font-size="11" font-weight="700">GATE 2 &#183; TECH INTERVIEW</text>
    <text x="16" y="49" fill="#A479C4" font-size="9">the hiring manager, talking shop</text>
    <text x="16" y="76" fill="#F8E8FF" font-size="9.5" font-weight="600">Wins on DEMONSTRATED SKILL:</text>
    <g font-size="9.5" font-weight="700" fill="#F8E8FF">
      <rect x="16" y="86" width="92" height="18" rx="4" fill="#00F0FF" fill-opacity="0.14"/><text x="62" y="99" text-anchor="middle">THM certs</text>
      <rect x="114" y="86" width="60" height="18" rx="4" fill="#00F0FF" fill-opacity="0.14"/><text x="144" y="99" text-anchor="middle">labs</text>
      <rect x="16" y="108" width="74" height="18" rx="4" fill="#00F0FF" fill-opacity="0.14"/><text x="53" y="121" text-anchor="middle">reports</text>
      <rect x="96" y="108" width="98" height="18" rx="4" fill="#00F0FF" fill-opacity="0.14"/><text x="145" y="121" text-anchor="middle">live profile</text>
    </g>
    <text x="16" y="150" fill="#7FE9F5" font-size="9">where TryHackMe + your paths pay off</text>
  </g>

  <!-- HIRED -->
  <line x1="594" y1="264" x2="594" y2="288" stroke="#FFB020" stroke-width="2" marker-end="url(#arrowgold)"/>
  <g transform="translate(500,290)">
    <rect x="0" y="0" width="188" height="30" rx="8" fill="#FFB020" fill-opacity="0.14" stroke="#FFB020" stroke-opacity="0.55"/>
    <text x="94" y="20" fill="#FFD37A" font-size="13" font-weight="700" letter-spacing="3" text-anchor="middle">HIRED</text>
  </g>
</svg>
