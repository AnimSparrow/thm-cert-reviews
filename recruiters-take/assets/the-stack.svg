<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="The play: stack a recognised cert as the key with a TryHackMe cert and profile as the proof">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a0633"/><stop offset="100%" stop-color="#3a0a5e"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#00B8D4"/></linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FF2A6D" stop-opacity="0"/><stop offset="50%" stop-color="#FF2A6D" stop-opacity="0.6"/><stop offset="100%" stop-color="#FF2A6D" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#FFB020"/></marker>
  </defs>
  <style>text{font-family:ui-monospace,'SF Mono',Menlo,'Cascadia Code',Consolas,monospace}</style>
  <rect x="0.5" y="0.5" width="779" height="249" rx="16" fill="url(#bg)" stroke="#FF2A6D" stroke-opacity="0.30"/>
  <path d="M 16,1 L 76,1 L 16,61 Z" fill="#FF2A6D" opacity="0.10"/>

  <text x="28" y="40" fill="url(#hero)" font-size="18" font-weight="700" filter="url(#glow)">THE PLAY: STACK THE KEY AND THE PROOF</text>
  <rect x="28" y="52" width="724" height="1" fill="url(#rule)"/>

  <!-- KEY card -->
  <g transform="translate(28,72)">
    <rect x="0" y="0" width="300" height="70" rx="10" fill="#FF2A6D" fill-opacity="0.08" stroke="#FF2A6D" stroke-opacity="0.55"/>
    <text x="16" y="26" fill="#FF2A6D" font-size="12" font-weight="700">THE KEY</text>
    <text x="16" y="44" fill="#F8E8FF" font-size="10.5" font-weight="600">A recognised name: Security+, CySA+, BTL1</text>
    <text x="16" y="60" fill="#FF7AA5" font-size="9.5">opens the door &#183; passes ATS + HR screening</text>
  </g>

  <text x="342" y="112" fill="#A479C4" font-size="20" font-weight="700" text-anchor="middle">+</text>

  <!-- PROOF card -->
  <g transform="translate(360,72)">
    <rect x="0" y="0" width="392" height="70" rx="10" fill="#00F0FF" fill-opacity="0.07" stroke="#00F0FF" stroke-opacity="0.55"/>
    <text x="16" y="26" fill="#00F0FF" font-size="12" font-weight="700">THE PROOF</text>
    <text x="16" y="44" fill="#F8E8FF" font-size="10.5" font-weight="600">A TryHackMe cert + a live profile you can link</text>
    <text x="16" y="60" fill="#7FE9F5" font-size="9.5">100+ hands-on days &#183; 200+ rooms &#183; reports &#183; wins the room</text>
  </g>

  <!-- arrow down to result -->
  <line x1="390" y1="150" x2="390" y2="176" stroke="#FFB020" stroke-width="2" marker-end="url(#ag)"/>

  <!-- result -->
  <g transform="translate(230,180)">
    <rect x="0" y="0" width="320" height="42" rx="10" fill="#FFB020" fill-opacity="0.13" stroke="#FFB020" stroke-opacity="0.55"/>
    <text x="160" y="20" fill="#FFD37A" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">A CANDIDATE WHO GETS IN</text>
    <text x="160" y="34" fill="#F8E8FF" font-size="9.5" text-anchor="middle">and then proves they belong there</text>
  </g>
</svg>
