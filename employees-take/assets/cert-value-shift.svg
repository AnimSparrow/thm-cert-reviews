<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" width="780" height="280" role="img" aria-label="Early on the certs are a learning tool; with experience they shift toward a badge collection and a map for mentoring">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a0633"/><stop offset="100%" stop-color="#3a0a5e"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#00B8D4"/></linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FF2A6D" stop-opacity="0"/><stop offset="50%" stop-color="#FF2A6D" stop-opacity="0.6"/><stop offset="100%" stop-color="#FF2A6D" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>text{font-family:ui-monospace,'SF Mono',Menlo,'Cascadia Code',Consolas,monospace}</style>
  <rect x="0.5" y="0.5" width="779" height="279" rx="16" fill="url(#bg)" stroke="#FF2A6D" stroke-opacity="0.30"/>
  <path d="M 16,1 L 76,1 L 16,61 Z" fill="#FF2A6D" opacity="0.10"/>

  <text x="24" y="40" fill="url(#hero)" font-size="18" font-weight="700" filter="url(#glow)">WHY YOU DO THEM CHANGES OVER TIME</text>
  <text x="24" y="59" fill="#A479C4" font-size="10.5" font-weight="600">the deeper in you go, the more the reason shifts from learning to collecting and mapping</text>
  <rect x="24" y="70" width="732" height="1" fill="url(#rule)"/>

  <!-- two-phase bars -->
  <g transform="translate(24,90)">
    <!-- Beginner -->
    <rect x="0" y="0" width="356" height="150" rx="10" fill="#00F0FF" fill-opacity="0.06" stroke="#00F0FF" stroke-opacity="0.45"/>
    <text x="16" y="26" fill="#00F0FF" font-size="12" font-weight="700">EARLY CAREER</text>
    <text x="16" y="48" fill="#F8E8FF" font-size="10" font-weight="600">Certs = a learning engine</text>
    <text x="16" y="72" fill="#BFF4FA" font-size="9.5">&#8226; rooms and paths teach you the job</text>
    <text x="16" y="88" fill="#BFF4FA" font-size="9.5">&#8226; every badge is new competence</text>
    <text x="16" y="104" fill="#BFF4FA" font-size="9.5">&#8226; fills an empty CV with real practice</text>
    <text x="16" y="134" fill="#5FD4E6" font-size="11" font-weight="700">Utility: very high</text>

    <!-- Experienced -->
    <rect x="376" y="0" width="356" height="150" rx="10" fill="#FFB020" fill-opacity="0.09" stroke="#FFB020" stroke-opacity="0.45"/>
    <text x="392" y="26" fill="#FFD37A" font-size="12" font-weight="700">EXPERIENCED</text>
    <text x="392" y="48" fill="#F8E8FF" font-size="10" font-weight="600">Certs = collection + recon</text>
    <text x="392" y="72" fill="#F0DCC0" font-size="9.5">&#8226; less new skill, more completeness</text>
    <text x="392" y="88" fill="#F0DCC0" font-size="9.5">&#8226; a map of what to recommend to others</text>
    <text x="392" y="104" fill="#F0DCC0" font-size="9.5">&#8226; still finds the gaps you never trained</text>
    <text x="392" y="134" fill="#FFC44D" font-size="11" font-weight="700">Utility: different, not zero</text>
  </g>

  <text x="24" y="266" fill="#F8E8FF" font-size="11" font-weight="600">I leaned in for the mentor in me: to know exactly what to hand a beginner, I had to walk it myself.</text>
</svg>
