<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" role="img" aria-label="Career arc powered by continuous practice: analyst to engineer to architect, and team lead of six to manager of ten">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a0633"/><stop offset="100%" stop-color="#3a0a5e"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#00B8D4"/></linearGradient>
    <linearGradient id="arcline" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#FFB020"/></linearGradient>
    <linearGradient id="ruleg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFB020" stop-opacity="0"/><stop offset="50%" stop-color="#FFB020" stop-opacity="0.6"/><stop offset="100%" stop-color="#FFB020" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softglow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>text{font-family:ui-monospace,'SF Mono',Menlo,'Cascadia Code',Consolas,monospace}</style>
  <rect x="0.5" y="0.5" width="779" height="299" rx="16" fill="url(#bg)" stroke="#FFB020" stroke-opacity="0.28"/>
  <path d="M 16,1 L 76,1 L 16,61 Z" fill="#FFB020" opacity="0.09"/>

  <text x="24" y="40" fill="url(#hero)" font-size="18" font-weight="700" filter="url(#glow)">WHAT PRACTICE DID FOR ME</text>
  <text x="24" y="59" fill="#A479C4" font-size="10.5" font-weight="600">years in IT, almost no cyber, then TryHackMe helped me catch the pack, then pass it</text>
  <rect x="24" y="70" width="732" height="1" fill="url(#ruleg)"/>

  <!-- rising line with nodes -->
  <polyline points="80,232 240,196 400,150 560,104 690,74" fill="none" stroke="url(#arcline)" stroke-width="3" opacity="0.85"/>

  <!-- nodes -->
  <g text-anchor="middle">
    <circle cx="80" cy="232" r="8" fill="#00F0FF" filter="url(#softglow)"/>
    <text x="80" y="258" fill="#F8E8FF" font-size="11" font-weight="700">ANALYST</text>

    <circle cx="240" cy="196" r="8" fill="#00F0FF" filter="url(#softglow)"/>
    <text x="240" y="222" fill="#F8E8FF" font-size="11" font-weight="700">ENGINEER</text>

    <circle cx="400" cy="150" r="8" fill="#7FE9F5" filter="url(#softglow)"/>
    <text x="400" y="176" fill="#F8E8FF" font-size="11" font-weight="700">ARCHITECT</text>

    <circle cx="560" cy="104" r="8" fill="#FFC44D" filter="url(#softglow)"/>
    <text x="560" y="94" fill="#FFD37A" font-size="11" font-weight="700">TEAM LEAD</text>
    <text x="560" y="130" fill="#C9B6E4" font-size="9">6 people</text>

    <circle cx="690" cy="74" r="9" fill="#FFB020" filter="url(#softglow)"/>
    <text x="690" y="64" fill="#FFD37A" font-size="11" font-weight="700">MANAGER</text>
    <text x="690" y="100" fill="#C9B6E4" font-size="9">10 people</text>
  </g>

  <text x="24" y="286" fill="#F8E8FF" font-size="11" font-weight="600">Same story, different speed: the platform let me compound skill fast enough to keep climbing.</text>
</svg>
