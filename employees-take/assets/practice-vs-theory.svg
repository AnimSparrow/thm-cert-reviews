<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" width="780" height="270" role="img" aria-label="Theory-only certs test memory of menus; hands-on certs test whether you can do the task">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a0633"/><stop offset="100%" stop-color="#3a0a5e"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#00B8D4"/></linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FF2A6D" stop-opacity="0"/><stop offset="50%" stop-color="#FF2A6D" stop-opacity="0.6"/><stop offset="100%" stop-color="#FF2A6D" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>text{font-family:ui-monospace,'SF Mono',Menlo,'Cascadia Code',Consolas,monospace}</style>
  <rect x="0.5" y="0.5" width="779" height="269" rx="16" fill="url(#bg)" stroke="#FF2A6D" stroke-opacity="0.30"/>
  <path d="M 16,1 L 76,1 L 16,61 Z" fill="#FF2A6D" opacity="0.10"/>

  <text x="24" y="40" fill="url(#hero)" font-size="18" font-weight="700" filter="url(#glow)">DOING BEATS MEMORISING</text>
  <text x="24" y="59" fill="#A479C4" font-size="10.5" font-weight="600">the whole market is drifting from theory-only exams toward skill-based, hands-on ones</text>
  <rect x="24" y="70" width="732" height="1" fill="url(#rule)"/>

  <!-- theory panel -->
  <g transform="translate(24,84)">
    <rect x="0" y="0" width="356" height="150" rx="10" fill="#FF2A6D" fill-opacity="0.06" stroke="#FF2A6D" stroke-opacity="0.45"/>
    <text x="16" y="26" fill="#FF7AA5" font-size="12" font-weight="700">THEORY-ONLY QUIZ</text>
    <text x="16" y="52" fill="#F8E8FF" font-size="10">"In which order do the prompts appear</text>
    <text x="16" y="67" fill="#F8E8FF" font-size="10">when configuring legacy log ingestion?"</text>
    <text x="16" y="92" fill="#C9B6E4" font-size="9.5">A task you touch once every few years,</text>
    <text x="16" y="106" fill="#C9B6E4" font-size="9.5">graded on whether you memorised the menu.</text>
    <text x="16" y="132" fill="#FF6699" font-size="10.5" font-weight="700">Tests recall. Forgotten by Friday.</text>
  </g>

  <!-- hands-on panel -->
  <g transform="translate(400,84)">
    <rect x="0" y="0" width="356" height="150" rx="10" fill="#00F0FF" fill-opacity="0.06" stroke="#00F0FF" stroke-opacity="0.45"/>
    <text x="16" y="26" fill="#00F0FF" font-size="12" font-weight="700">HANDS-ON ROOM</text>
    <text x="16" y="52" fill="#F8E8FF" font-size="10">"Here is the box. Find the flaw,</text>
    <text x="16" y="67" fill="#F8E8FF" font-size="10">exploit it, and explain how."</text>
    <text x="16" y="92" fill="#BFF4FA" font-size="9.5">The same muscle you use on the job,</text>
    <text x="16" y="106" fill="#BFF4FA" font-size="9.5">built by repetition until it is reflex.</text>
    <text x="16" y="132" fill="#5FD4E6" font-size="10.5" font-weight="700">Tests skill. Stays with you.</text>
  </g>

  <text x="24" y="256" fill="#F8E8FF" font-size="11" font-weight="600">I am a practitioner. Quizzes drain me; labs light me up, and the market is finally agreeing.</text>
</svg>
