<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" role="img" aria-label="The learning is the cake, the certificate is the cherry: rooms and paths and skill are the real value, the cert sits on top">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a0633"/><stop offset="100%" stop-color="#3a0a5e"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#00B8D4"/></linearGradient>
    <linearGradient id="ruleg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFB020" stop-opacity="0"/><stop offset="50%" stop-color="#FFB020" stop-opacity="0.6"/><stop offset="100%" stop-color="#FFB020" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softglow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>text{font-family:ui-monospace,'SF Mono',Menlo,'Cascadia Code',Consolas,monospace}</style>
  <rect x="0.5" y="0.5" width="779" height="299" rx="16" fill="url(#bg)" stroke="#FFB020" stroke-opacity="0.28"/>
  <path d="M 16,1 L 76,1 L 16,61 Z" fill="#FFB020" opacity="0.09"/>

  <text x="24" y="40" fill="url(#hero)" font-size="18" font-weight="700" filter="url(#glow)">THE LEARNING IS THE CAKE</text>
  <text x="24" y="59" fill="#A479C4" font-size="10.5" font-weight="600">the certificate is just the cherry on top, and that is exactly the right order</text>
  <rect x="24" y="70" width="732" height="1" fill="url(#ruleg)"/>

  <!-- stacked layers (widest at bottom = most value) -->
  <g transform="translate(150,0)">
    <!-- cherry -->
    <circle cx="240" cy="98" r="13" fill="#FF2A6D" filter="url(#softglow)"/>
    <rect x="238" y="86" width="4" height="10" fill="#7E63B0"/>
    <!-- top layer: CERT -->
    <rect x="150" y="110" width="180" height="30" rx="6" fill="#FFB020" fill-opacity="0.22" stroke="#FFB020" stroke-opacity="0.6"/>
    <text x="240" y="130" fill="#FFD37A" font-size="12" font-weight="700" text-anchor="middle">THE CERTIFICATE</text>
    <!-- layer 2: badges -->
    <rect x="110" y="146" width="260" height="30" rx="6" fill="#A479C4" fill-opacity="0.20" stroke="#A479C4" stroke-opacity="0.55"/>
    <text x="240" y="166" fill="#E6D6F5" font-size="12" font-weight="700" text-anchor="middle">BADGES &amp; PROGRESS</text>
    <!-- layer 3: paths -->
    <rect x="70" y="182" width="340" height="30" rx="6" fill="#00F0FF" fill-opacity="0.16" stroke="#00F0FF" stroke-opacity="0.5"/>
    <text x="240" y="202" fill="#BFF4FA" font-size="12" font-weight="700" text-anchor="middle">GUIDED LEARNING PATHS</text>
    <!-- base: skill -->
    <rect x="30" y="218" width="420" height="34" rx="6" fill="url(#hero)" opacity="0.9" filter="url(#softglow)"/>
    <text x="240" y="240" fill="#04222b" font-size="13" font-weight="700" text-anchor="middle">HANDS-ON SKILL &#183; 200+ ROOMS</text>
  </g>

  <text x="24" y="284" fill="#F8E8FF" font-size="11" font-weight="600">Chase the cake. The cherry is nice, but nobody built a career on frosting alone.</text>
</svg>
