  <style>text{font-family:ui-monospace,'SF Mono',Menlo,'Cascadia Code',Consolas,monospace}</style>
  <rect x="0.5" y="0.5" width="899" height="149" rx="14" fill="url(#bg)" stroke="#FFB020" stroke-opacity="0.28"/>
