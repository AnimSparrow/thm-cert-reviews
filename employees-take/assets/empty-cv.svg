<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" width="780" height="280" role="img" aria-label="An empty CV after school becomes a CV with proof once you add badges, a profile link, activity and rooms cleared">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a0633"/><stop offset="100%" stop-color="#3a0a5e"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#00B8D4"/></linearGradient>
    <linearGradient id="ruleg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFB020" stop-opacity="0"/><stop offset="50%" stop-color="#FFB020" stop-opacity="0.6"/><stop offset="100%" stop-color="#FFB020" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#FFB020"/></marker>
  </defs>
  <style>text{font-family:ui-monospace,'SF Mono',Menlo,'Cascadia Code',Consolas,monospace}</style>
  <rect x="0.5" y="0.5" width="779" height="279" rx="16" fill="url(#bg)" stroke="#FFB020" stroke-opacity="0.28"/>
  <path d="M 16,1 L 76,1 L 16,61 Z" fill="#FFB020" opacity="0.09"/>

  <text x="24" y="40" fill="url(#hero)" font-size="18" font-weight="700" filter="url(#glow)">FROM EMPTY PAGE TO PROOF</text>
  <text x="24" y="59" fill="#A479C4" font-size="10.5" font-weight="600">just finished school with nothing to show? this is how you fill the page</text>
  <rect x="24" y="70" width="732" height="1" fill="url(#ruleg)"/>

  <!-- empty CV -->
  <g transform="translate(60,92)">
    <rect x="0" y="0" width="180" height="150" rx="8" fill="#2a0e4a" stroke="#5C2A8A" stroke-opacity="0.6"/>
    <text x="90" y="24" fill="#8A6FBF" font-size="10" font-weight="700" text-anchor="middle">CV &#183; DAY ONE</text>
    <rect x="20" y="42" width="140" height="6" rx="3" fill="#3a1a5e"/>
    <rect x="20" y="60" width="110" height="6" rx="3" fill="#3a1a5e"/>
    <text x="90" y="104" fill="#6E5397" font-size="10" text-anchor="middle">"Finished school."</text>
    <text x="90" y="122" fill="#6E5397" font-size="10" text-anchor="middle">and... that's it.</text>
  </g>

  <line x1="252" y1="167" x2="300" y2="167" stroke="#FFB020" stroke-width="2" marker-end="url(#ag)"/>

  <!-- CV with proof -->
  <g transform="translate(312,92)">
    <rect x="0" y="0" width="408" height="150" rx="8" fill="#00F0FF" fill-opacity="0.06" stroke="#00F0FF" stroke-opacity="0.5"/>
    <text x="16" y="24" fill="#00F0FF" font-size="10" font-weight="700">CV &#183; WITH PROOF</text>
    <g font-size="9.5" font-weight="700" fill="#F8E8FF">
      <rect x="16" y="36" width="120" height="20" rx="5" fill="#00F0FF" fill-opacity="0.14"/><text x="76" y="50" text-anchor="middle">path badges</text>
      <rect x="144" y="36" width="150" height="20" rx="5" fill="#00F0FF" fill-opacity="0.14"/><text x="219" y="50" text-anchor="middle">profile link</text>
      <rect x="16" y="62" width="150" height="20" rx="5" fill="#00F0FF" fill-opacity="0.14"/><text x="91" y="76" text-anchor="middle">100+ day streak</text>
      <rect x="174" y="62" width="120" height="20" rx="5" fill="#00F0FF" fill-opacity="0.14"/><text x="234" y="76" text-anchor="middle">200+ rooms</text>
    </g>
    <text x="16" y="106" fill="#BFF4FA" font-size="9.5">Technical reviewers see it instantly; even a</text>
    <text x="16" y="120" fill="#BFF4FA" font-size="9.5">recruiter reads "did more than a diploma."</text>
    <text x="16" y="140" fill="#5FD4E6" font-size="10.5" font-weight="700">That is work experience from labs and CTFs.</text>
  </g>

  <text x="24" y="266" fill="#F8E8FF" font-size="11" font-weight="600">Link the profile. Let them see you have been doing the work, not just talking about it.</text>
</svg>
